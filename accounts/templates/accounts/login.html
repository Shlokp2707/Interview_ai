{% extends "base.html" %}
{% block title %}Sign In — HireAI{% endblock %}
{% block content %}
<div class="container" style="max-width: 480px;">
  <div class="page-header">
    <h1>Welcome Back</h1>
    <p>Sign in to your HireAI account</p>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert alert-error">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
      {% endif %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
        Sign In
      </button>
    </form>

    <hr/>
    <p style="text-align: center; font-size: 0.9rem; color: var(--muted);">
      Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
