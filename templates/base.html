<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}HireAI — Next-Gen Recruitment{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0a0b10;
    --surface:      rgba(20, 22, 33, 0.7);
    --surface-hover:rgba(30, 33, 49, 0.85);
    --border:       rgba(255, 255, 255, 0.08);
    --accent:       #6366f1;
    --accent-glow:  rgba(99, 102, 241, 0.15);
    --accent2:      #10b981;
    --accent2-glow: rgba(16, 185, 129, 0.15);
    --danger:       #ef4444;
    --warn:         #f59e0b;
    --text:         #f1f5f9;
    --muted:        #94a3b8;
    --radius:       16px;
    --shadow:       0 12px 40px -8px rgba(0, 0, 0, 0.5);
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: radial-gradient(circle at 50% 0%, #1c1d30 0%, var(--bg) 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }
  
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }
  a:hover {
    color: #818cf8;
    text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
  }

  /* Nav */
  nav {
    background: rgba(10, 11, 16, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .nav-brand span {
    background: linear-gradient(135deg, #a5b4fc, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.75rem;
  }
  .nav-links a {
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .nav-links a:hover, .nav-links a.active {
    color: var(--text);
  }
  .nav-auth {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.9rem;
  }
  .user-badge {
    background: var(--border);
    padding: 0.4rem 0.8rem;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* Container */
  .container { max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; }
  .container-wide { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }

  /* Cards */
  .card {
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(99, 102, 241, 0.25);
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7), 0 0 20px 0 rgba(99, 102, 241, 0.05);
  }
  .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); }
  .card-meta  { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .65rem 1.5rem; border-radius: 10px; border: 1px solid transparent;
    font-size: .9rem; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Inter', sans-serif;
  }
  .btn:hover { transform: translateY(-1px); opacity: 0.95; }
  .btn-primary   { background: var(--accent);  color: #fff; box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.4); }
  .btn-primary:hover { box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.5); }
  .btn-success   { background: var(--accent2); color: #0a0b10; box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3); }
  .btn-success:hover { box-shadow: 0 6px 20px 0 rgba(16, 185, 129, 0.45); }
  .btn-danger    { background: var(--danger);  color: #fff; }
  .btn-outline   { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.03); border-color: var(--muted); }
  .btn-sm        { padding: .4rem 1rem; font-size: .8rem; border-radius: 8px; }

  /* Form */
  .form-group  { margin-bottom: 1.5rem; }
  label        { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .5rem; font-weight: 600; letter-spacing: 0.3px; }
  input[type="text"], input[type="email"], input[type="number"], input[type="password"],
  textarea, select {
    width: 100%; padding: .75rem 1rem;
    background: rgba(10, 11, 16, 0.5); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: .92rem;
    transition: all .2s ease;
    font-family: 'Inter', sans-serif;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); background: rgba(10, 11, 16, 0.8); box-shadow: 0 0 0 3px var(--accent-glow); }
  textarea { resize: vertical; min-height: 120px; }

  /* Badge */
  .badge {
    display: inline-block; padding: .25rem .75rem; border-radius: 30px;
    font-size: .75rem; font-weight: 600; letter-spacing: 0.3px;
  }
  .badge-green  { background: rgba(16,185,129,.12); color: var(--accent2); border: 1px solid rgba(16,185,129,.2); }
  .badge-red    { background: rgba(239,68,68,.12); color: var(--danger); border: 1px solid rgba(239,68,68,.2); }
  .badge-yellow { background: rgba(245,158,11,.12); color: var(--warn); border: 1px solid rgba(245,158,11,.2); }
  .badge-purple { background: rgba(99,102,241,.12);  color: var(--accent); border: 1px solid rgba(99,102,241,.2); }
  .badge-gray   { background: rgba(148,163,184,.12); color: var(--muted); border: 1px solid rgba(148,163,184,.2); }

  /* Page header */
  .page-header { margin-bottom: 2.5rem; text-align: center; }
  .page-header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff, var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .page-header p  { color: var(--muted); margin-top: .5rem; font-size: 1.05rem; }

  /* Tags */
  .tags { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .tag  { background: rgba(99,102,241,.08); color: #a5b4fc; padding: .25rem .7rem; border-radius: 8px; font-size: .78rem; border: 1px solid rgba(99,102,241,0.15); }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

  /* Alert */
  .alert { padding: 1rem 1.25rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: .9rem; border: 1px solid transparent; }
  .alert-error   { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.2); color: #fca5a5; }
  .alert-success { background: rgba(16,185,129,.08);  border-color: rgba(16,185,129,.2);  color: #6ee7b7; }
  .alert-info    { background: rgba(99,102,241,.08); border-color: rgba(99,102,241,.2); color: #c7d2fe; }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr; }
    nav {
      flex-direction: column;
      height: auto;
      padding: 1rem;
      gap: 0.75rem;
      align-items: center;
      text-align: center;
    }
    .nav-links {
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .nav-auth {
      margin-top: 0.25rem;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .container, .container-wide {
      padding: 1.5rem 1rem;
    }
  }

  /* Stat box */
  .stat-box { text-align: center; padding: 1.5rem; background: rgba(255, 255, 255, 0.02); border-radius: 12px; border: 1px solid var(--border); }
  .stat-box .stat-val  { font-size: 2.2rem; font-weight: 800; color: var(--accent); font-family: 'Outfit', sans-serif; }
  .stat-box .stat-label { font-size: .82rem; color: var(--muted); margin-top: .25rem; font-weight: 500; }

  /* Score bar */
  .score-bar-wrap { background: rgba(255, 255, 255, 0.05); border-radius: 6px; height: 10px; margin-top: .5rem; overflow: hidden; border: 1px solid var(--border); }
  .score-bar      { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), #818cf8); transition: width .8s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
</head>
<body>
<nav>
  <a href="{% url 'home' %}" class="nav-brand">
    ⚡ <span>HireAI</span>
  </a>
  <div class="nav-links">
    <a href="{% url 'home' %}">Find Jobs</a>
    {% if user.is_authenticated %}
      {% if user.is_staff %}
        <a href="{% url 'hr_dashboard' %}">HR Dashboard</a>
        <a href="{% url 'create_job' %}">Post Job</a>
      {% endif %}
    {% endif %}
  </div>
  <div class="nav-auth">
    {% if user.is_authenticated %}
      <a href="{% url 'profile' %}" class="user-badge" style="text-decoration: none;">👤 {{ user.username }}{% if user.is_staff %} (HR){% endif %}</a>
      <a href="{% url 'logout' %}" class="btn btn-outline btn-sm">Log Out</a>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-outline btn-sm" style="border:none;">Sign In</a>
      <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
    {% endif %}
  </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
